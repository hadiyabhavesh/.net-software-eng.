Create an HTML file that uses semantic tags to build a simple blog post  
<header> for the blog title, <nav> for navigation links (Home, Explore, About),
<article> for the main post content, and <footer> for copyright information.
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
</head>
<body>
    <header>
        <h1> Blog Title</h1>
    </header>
    <nav>
        <li><a href="home.html"> About</a></li>
        <li><a href="Explore.html">Explore</a></li>
        <li><a href="About.html">About </a></li>
    </nav>
</body>
</html>
