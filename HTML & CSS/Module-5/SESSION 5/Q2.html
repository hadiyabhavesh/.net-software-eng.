<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra style offer baner</title>
</head>
<style> 
    *{
         margin: 0;
         padding: 0;
         box-sizing: border-box;
    }
    body{
        
        background-color: #f5f5f5;      
    }
    .baner{
        display: flex;
        align-items: center;
        justify-content: space-around;
        width: 100%;
        height: 100px;
        background: linear-gradient(90deg, #ff9800, #ffb300);
        margin: 20px 10px ;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }
    .offer{
        font-weight: bolder;
        font-size: 45px;
        padding: 0px 10px;
    }
    .offer span{
        font-size: 20px;
    vertical-align: top;
    }
    .purchase{
        font-size: 24px;
        font-weight: bold;
        text-align: center;
}
.purchase span{
    font-size: 20px;
    vertical-align: super;
}
</style>
<body>
    <div class="baner">
    <div class="offer">
        FLAT <span>&#8377;</span>300 OFF
    </div>
    <div class="purchase">
        On Your 1 <span>st</span> Purchase<br>
            Via  Myntra App!
    </div>
    </div>
</body>
</html>
