<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Order Form</title>
</head>
<body>

  <h1>Food Order</h1>

  <form>
   
    <label for="orderId">Order ID:</label>
    <input
      type="text"
      id="orderId"
      name="orderId"
      value="ORD12345"
      disabled
    >
    <br><br>
    
    <label for="userName">Your Name:</label>
    <input type="text" id="userName" name="userName" required>
    <br><br>

    <label for="foodItem">Select Food Item:</label>
    <select id="foodItem" name="foodItem" required>
      <option value="">-- Choose an item --</option>
      <option value="pizza">Margherita Pizza</option>
      <option value="burger">Veg Cheese Burger</option>
      <option value="biryani">Chicken Biryani</option>
    </select>
    <br><br>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity" min="1" required>
    <br><br>

    <label for="instructions">Delivery Instructions:</label>
    <br>
    <textarea
      id="instructions"
      name="instructions"
      rows="5"
      cols="40"
      required
    ></textarea>
    <br><br>

    <button type="submit">Place Order</button>
  </form>

</body>
</html>
