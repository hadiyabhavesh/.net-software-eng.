<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Listings</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            margin: 0;
            padding: 24px;
        }

        .restaurant-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        article {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 10px #00000012;
            transition: transform 0.2s;
        }

        article:hover {
            transform: translateY(-4px);
        }

        article img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        header,
        .details,
        footer {
            padding: 12px 16px;
        }

        header h2 {
            font-size: 20px;
            margin: 0;
        }

        .details p {
            color: #777;
            margin: 6px 0;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            font-size: 14px;
        }

        .rating {
            background: #267e3e;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
        }

        .delivery {
            color: #444;
        }
    </style>
</head>

<body>

    <main class="restaurant-list">

        <article>
            <img src="OIP.webp" alt="Indian food at Spice Garden">

            <header>
                <h2>Spice Garden</h2>
            </header>

            <section class="details">
                <p>North Indian, Chinese</p>
                <p>₹300 for two</p>
            </section>

            <footer>
                <span class="rating">★ 4.5</span>
                <span class="delivery">25–30 min</span>
            </footer>
        </article>

        <article>
            <img src="OIP.webp" alt="Burgers at Burger Junction">

            <header>
                <h2>Burger Junction</h2>
            </header>

            <section class="details">
                <p>Burgers, Fast Food</p>
                <p>₹250 for two</p>
            </section>

            <footer>
                <span class="rating">★ 4.2</span>
                <span class="delivery">20–25 min</span>
            </footer>
        </article>

        <article>
            <img src="https://placehold.co/600x350?text=Pizza+Point" alt="Pizza at Pizza Point">

            <header>
                <h2>Pizza Point</h2>
            </header>

            <section class="details">
                <p>Pizza, Italian</p>
                <p>₹400 for two</p>
            </section>

            <footer>
                <span class="rating">★ 4.7</span>
                <span class="delivery">30–35 min</span>
            </footer>
        </article>

    </main>

</body>

</html>
