<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .restaurant-card {
            width: 320px;
            background-color: white;
            border: 2px solid #e23744;
            border-radius: 10px;
            margin: 20px;
            padding: 20px;
            text-align: center;
        }

        .restaurant-name {
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            color: #e23744;
        }

        .cuisine {
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            color: #555;
        }

        .rating {
            padding: 12px;
            border: 1px solid #ddd;
            background-color: #267e3e;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="restaurant-card">

        <div class="restaurant-name">
            <h2>Spice Garden</h2>
        </div>

        <div class="cuisine">
            <p>North Indian, Chinese</p>
        </div>

        <div class="rating">
            <p>★ 4.5 / 5 Rating</p>
        </div>

    </div>

</body>
</html>
